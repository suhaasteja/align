services:
  tv-remote:
    build: .
    image: tv-remote
    container_name: tv-remote
    restart: unless-stopped

    # Host networking is not optional here. The container has to send SSDP
    # multicast onto your LAN and open connections to the TV's 192.168.x.x
    # address; Docker's default bridge network can do neither.
    #
    # This works on Linux (Raspberry Pi, NAS, any Linux box). It does NOT work
    # properly on Docker Desktop for Mac or Windows, where the "host" is a
    # hidden Linux VM rather than your actual machine — there, run it with
    # `npm start` directly instead of in Docker.
    network_mode: host

    volumes:
      - tv-remote-data:/data

    environment:
      - PORT=8477
      - TV_REMOTE_HOME=/data
      # Strongly recommended if you pair this with the tunnel profile below.
      - TV_REMOTE_PIN=${TV_REMOTE_PIN:-}

  # Optional: a public HTTPS URL via Cloudflare Tunnel, without port forwarding.
  #
  #   TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  #
  # Create the tunnel and token at one.dash.cloudflare.com > Networks > Tunnels,
  # pointing it at http://localhost:8477. Set TV_REMOTE_PIN before enabling
  # this, and ideally put Cloudflare Access in front of the hostname too.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tv-remote-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    network_mode: host
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - tv-remote

volumes:
  tv-remote-data:
